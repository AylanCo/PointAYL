    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f1115;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }

        .amex-card {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
            transition: transform 0.1s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .amex-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: skewX(-20deg);
            animation: shine 5s infinite;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes shine {
            0% { left: -150%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }

        .card-silhouette-watermark {
            position: absolute;
            right: -10%; top: 50%;
            transform: translateY(-50%) rotate(-5deg);
            width: 250px; height: 250px;
            opacity: 0.48; mix-blend-mode: overlay;
            filter: contrast(150%) brightness(120%);
            pointer-events: none; z-index: 2; object-fit: contain;
        }

        .card-basic {
            background: linear-gradient(135deg, #78350f 0%, #b45309 35%, #d97706 70%, #451a03 100%);

        }
        .card-gold {
            background: linear-gradient(135deg, #fffbeb 0%, #fde047 25%, #d97706 65%, #78350f 100%);
            color: #1c1917;
            border: 1px solid rgba(253, 224, 71, 0.6);
        }
        .card-platinum {
            background: linear-gradient(135deg, #18181b 0%, #09090b 30%, #2e1065 70%, #581c87 100%);
            color: #fafafa;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }

        .card-3d-wrap { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
